services:
  web:
    build: .
    image: omora-website
    container_name: omora-website
    restart: unless-stopped
    # Published on localhost only. The droplet's existing reverse proxy
    # (the one serving managementdoral.alfredsensual.com) terminates
    # HTTPS and forwards omora.alfredsensual.com to this port.
    #
    # For a quick local preview, open http://localhost:8092
    ports:
      - "127.0.0.1:8092:80"

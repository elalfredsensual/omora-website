# ───────────────────────────────────────────────────────────────
#  nginx site — omora.alfredsensual.com
#
#  Reverse-proxies the domain to the Omora static-site container,
#  which docker-compose publishes on 127.0.0.1:8092.
#
#  Install on the droplet (does NOT touch the managementdoral config):
#    sudo cp deploy/omora.alfredsensual.com.conf \
#            /etc/nginx/sites-available/omora.alfredsensual.com
#    sudo ln -s /etc/nginx/sites-available/omora.alfredsensual.com \
#               /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d omora.alfredsensual.com
#
#  certbot rewrites the installed copy to add the SSL config and the
#  HTTP->HTTPS redirect automatically.
# ───────────────────────────────────────────────────────────────

server {
    listen      80;
    listen      [::]:80;
    server_name omora.alfredsensual.com;

    # Omora static-site container (see docker-compose.yml)
    location / {
        proxy_pass         http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
